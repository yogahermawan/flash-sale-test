name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flash_sale
          POSTGRES_USER: flash_sale
          POSTGRES_PASSWORD: flash_sale
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flash_sale -d flash_sale"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://flash_sale:flash_sale@localhost:5432/flash_sale
      TEST_DATABASE_URL: postgres://flash_sale:flash_sale@localhost:5432/flash_sale_test
      E2E_DATABASE_URL: postgres://flash_sale:flash_sale@localhost:5432/flash_sale_test
      REDIS_URL: redis://localhost:6379
      INTERNAL_API_KEY: ci-internal-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=flash_sale psql -h localhost -U flash_sale -d postgres -c 'CREATE DATABASE flash_sale_test;'
      - run: pnpm typecheck && pnpm build
      - run: pnpm -C backend test
      - run: pnpm -C backend test:integration
      - run: pnpm -C frontend exec playwright install --with-deps chromium
      - run: pnpm -C frontend test:e2e
